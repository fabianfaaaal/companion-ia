[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-ia"
version = "0.0.2a1"
description = "Local-first companion desktop preview"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.12.0"]

[project.gui-scripts]
companion-ia = "companion.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
